syntax = "proto3";

package kv;

option go_package = "github.com/Almeida394/raft-kv/internal/api/kvpb;kvpb";

// KV is the client-facing API: the same GET/PUT/DELETE surface the HTTP
// API exposes, offered as gRPC too. A non-leader node forwards these
// calls to the current leader rather than rejecting them, so any node
// can be used as the entry point.
service KV {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bytes value = 1;
  bool found = 2;
}

message PutRequest {
  string key = 1;
  bytes value = 2;
}

message PutResponse {}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {}
